<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alma Barranquillera – La cultura vive todo el año</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --amarillo: #F5C400;
    --rojo: #E03A2F;
    --azul: #1A4FA0;
    --naranja: #F47920;
    --blanco: #FDFAF3;
    --oscuro: #1A1210;
    --gris: #6B6560;
    --gris-claro: #F3EFE8;
    --fondo: #FDFAF3;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--fondo);
    color: var(--oscuro);
    overflow-x: hidden;
  }

  /* ─── PATTERNS & TEXTURES ─── */
  .confetti-bg {
    background-image:
      radial-gradient(circle at 15% 25%, rgba(245,196,0,0.12) 0%, transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(224,58,47,0.10) 0%, transparent 35%),
      radial-gradient(circle at 70% 80%, rgba(26,79,160,0.10) 0%, transparent 40%),
      radial-gradient(circle at 10% 85%, rgba(244,121,32,0.10) 0%, transparent 35%);
  }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5%;
    height: 72px;
    background: rgba(253,250,243,0.92);
    backdrop-filter: blur(14px);
    border-bottom: 2px solid transparent;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  nav.scrolled {
    border-bottom-color: var(--amarillo);
    box-shadow: 0 4px 24px rgba(26,18,16,0.10);
  }

  .nav-logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
  }
  .logo-mark {
    width: 44px; height: 44px;
    background: var(--rojo);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 3px 3px 0 var(--amarillo);
    flex-shrink: 0;
    transition: transform 0.3s;
  }
  .nav-logo:hover .logo-mark { transform: rotate(-8deg) scale(1.07); }
  .logo-text { line-height: 1.1; }
  .logo-text strong {
    display: block; font-family: 'Playfair Display', serif;
    font-size: 1.15rem; color: var(--oscuro);
  }
  .logo-text span { font-size: 0.72rem; color: var(--gris); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

  .nav-links {
    display: flex; gap: 2px; list-style: none;
    align-items: center;
  }
  .nav-links a {
    text-decoration: none; color: var(--oscuro);
    font-weight: 700; font-size: 0.88rem;
    padding: 8px 14px; border-radius: 8px;
    transition: background 0.2s, color 0.2s;
  }
  .nav-links a:hover { background: var(--amarillo); color: var(--oscuro); }
  .nav-links .btn-nav {
    background: var(--rojo); color: #fff !important;
    border-radius: 50px; padding: 9px 20px;
    box-shadow: 3px 3px 0 var(--oscuro);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .nav-links .btn-nav:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--oscuro); background: var(--rojo) !important; }

  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 6px; }
  .hamburger span { width: 26px; height: 3px; background: var(--oscuro); border-radius: 2px; transition: 0.3s; display: block; }

  .mobile-menu {
    display: none;
    position: fixed; top: 72px; left: 0; right: 0;
    background: var(--fondo); z-index: 99;
    padding: 16px 5% 24px;
    border-bottom: 3px solid var(--amarillo);
    flex-direction: column; gap: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu a {
    text-decoration: none; color: var(--oscuro);
    font-weight: 700; font-size: 1rem;
    padding: 12px 16px; border-radius: 10px;
    transition: background 0.2s;
  }
  .mobile-menu a:hover { background: var(--amarillo); }

  /* ─── HERO ─── */
  #inicio {
    min-height: 100vh;
    padding-top: 72px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
    padding-inline: 5%;
    overflow: hidden;
    position: relative;
    background: var(--fondo);
  }
  #inicio::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 70% at 80% 50%, rgba(245,196,0,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 40% 50% at 20% 80%, rgba(244,121,32,0.13) 0%, transparent 50%);
    pointer-events: none;
  }

  .hero-content { position: relative; z-index: 2; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--amarillo); color: var(--oscuro);
    padding: 6px 16px; border-radius: 50px;
    font-weight: 800; font-size: 0.78rem; letter-spacing: 0.05em;
    text-transform: uppercase; margin-bottom: 20px;
    border: 2px solid var(--oscuro);
    box-shadow: 3px 3px 0 var(--oscuro);
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 4.5vw, 3.8rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--oscuro);
    margin-bottom: 20px;
  }
  .hero-title .highlight {
    color: var(--rojo);
    position: relative;
  }
  .hero-title .highlight::after {
    content: '';
    position: absolute; left: 0; bottom: -4px; right: 0; height: 5px;
    background: var(--amarillo);
    border-radius: 3px;
  }

  .hero-sub {
    font-size: 1.1rem; color: var(--gris);
    line-height: 1.7; margin-bottom: 36px;
    max-width: 480px;
  }

  .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--rojo); color: #fff;
    font-weight: 800; font-size: 1rem;
    padding: 14px 28px; border-radius: 50px;
    text-decoration: none; border: none; cursor: pointer;
    box-shadow: 4px 4px 0 var(--oscuro);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-primary:hover { transform: translate(-3px,-3px); box-shadow: 7px 7px 0 var(--oscuro); }

  .btn-secondary {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; color: var(--oscuro);
    font-weight: 800; font-size: 1rem;
    padding: 14px 28px; border-radius: 50px;
    text-decoration: none; border: 2.5px solid var(--oscuro); cursor: pointer;
    transition: background 0.2s;
  }
  .btn-secondary:hover { background: var(--amarillo); }

  .hero-stats {
    display: flex; gap: 28px; margin-top: 40px;
    padding-top: 28px; border-top: 2px solid rgba(26,18,16,0.10);
  }
  .hstat { text-align: center; }
  .hstat strong {
    display: block; font-family: 'Playfair Display', serif;
    font-size: 1.9rem; color: var(--azul);
  }
  .hstat span { font-size: 0.8rem; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: 0.04em; }

  /* Hero visual side */
  .hero-visual {
    position: relative; z-index: 2;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .hero-card {
    border-radius: 20px; overflow: hidden;
    position: relative; aspect-ratio: 3/4;
    background: var(--gris-claro);
    border: 3px solid var(--oscuro);
    box-shadow: 6px 6px 0 var(--oscuro);
    transition: transform 0.3s;
  }
  .hero-card:hover { transform: translate(-4px,-4px); }
  .hero-card:nth-child(2) { margin-top: 40px; }
  .hero-card img { width: 100%; height: 100%; object-fit: cover; }
  .hero-card .card-label {
    position: absolute; bottom: 12px; left: 12px; right: 12px;
    background: rgba(26,18,16,0.82); color: #fff;
    padding: 8px 12px; border-radius: 10px;
    font-size: 0.82rem; font-weight: 700;
    backdrop-filter: blur(6px);
  }
  .hero-card .card-cat {
    font-size: 0.72rem; color: var(--amarillo);
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* ─── SECTION COMMONS ─── */
  section { padding: 90px 5%; }
  .section-tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--naranja);
    margin-bottom: 10px;
  }
  .section-tag::before { content: '◆'; font-size: 0.6rem; }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.9rem, 3.5vw, 2.9rem);
    font-weight: 900; line-height: 1.15;
    margin-bottom: 14px;
  }
  .section-sub {
    font-size: 1.05rem; color: var(--gris);
    max-width: 600px; line-height: 1.65; margin-bottom: 48px;
  }

  /* ─── FILTERS ─── */
  .filter-bar {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 36px;
  }
  .filter-btn {
    padding: 8px 18px; border-radius: 50px;
    font-weight: 700; font-size: 0.88rem;
    cursor: pointer; border: 2px solid var(--oscuro);
    background: transparent; color: var(--oscuro);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--oscuro); color: #fff;
    transform: translate(-2px,-2px);
  }
  .filter-btn.active { box-shadow: 3px 3px 0 var(--naranja); }

  /* ─── TALENT CARDS ─── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 24px;
  }

  .talent-card {
    background: #fff; border: 2.5px solid var(--oscuro);
    border-radius: 20px; overflow: hidden;
    box-shadow: 5px 5px 0 var(--oscuro);
    transition: transform 0.25s, box-shadow 0.25s;
    cursor: pointer;
  }
  .talent-card:hover { transform: translate(-5px,-5px); box-shadow: 10px 10px 0 var(--oscuro); }

  .tc-img {
    width: 100%; aspect-ratio: 4/3; object-fit: cover;
    background: var(--gris-claro);
    display: block;
  }
  .tc-body { padding: 18px; }
  .tc-cat {
    display: inline-block; padding: 3px 12px; border-radius: 50px;
    font-size: 0.74rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 8px;
  }
  .cat-artesano { background: var(--amarillo); color: var(--oscuro); }
  .cat-musico   { background: var(--rojo); color: #fff; }
  .cat-bailarin { background: var(--naranja); color: #fff; }
  .cat-gestor   { background: var(--azul); color: #fff; }

  .tc-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem; font-weight: 700;
    margin-bottom: 6px; color: var(--oscuro);
  }
  .tc-desc { font-size: 0.88rem; color: var(--gris); line-height: 1.55; margin-bottom: 14px; }
  .tc-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 12px; border-top: 1.5px dashed rgba(26,18,16,0.12);
  }
  .tc-rating { font-size: 0.84rem; font-weight: 700; color: var(--naranja); }
  .btn-ver {
    background: var(--oscuro); color: #fff;
    padding: 7px 16px; border-radius: 50px;
    font-size: 0.82rem; font-weight: 800;
    text-decoration: none; border: none; cursor: pointer;
    transition: background 0.2s;
  }
  .btn-ver:hover { background: var(--rojo); }

  /* ─── EVENTS ─── */
  #eventos { background: var(--oscuro); }
  #eventos .section-tag { color: var(--amarillo); }
  #eventos .section-title { color: #fff; }
  #eventos .section-sub { color: rgba(255,255,255,0.65); }

  .events-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
  }
  .event-card {
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 20px; overflow: hidden;
    transition: transform 0.25s, border-color 0.25s;
  }
  .event-card:hover { transform: translateY(-6px); border-color: var(--amarillo); }
  .event-img {
    width: 100%; aspect-ratio: 16/9; object-fit: cover;
    display: block; background: #2a2020;
  }
  .event-body { padding: 20px; }
  .event-date {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--amarillo); font-size: 0.8rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
  }
  .event-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem; color: #fff; font-weight: 700;
    margin-bottom: 8px;
  }
  .event-loc { font-size: 0.85rem; color: rgba(255,255,255,0.55); margin-bottom: 10px; }
  .event-desc { font-size: 0.88rem; color: rgba(255,255,255,0.65); line-height: 1.55; }
  .event-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .event-tag {
    padding: 4px 12px; border-radius: 50px;
    font-size: 0.74rem; font-weight: 800;
    background: var(--naranja); color: #fff;
  }
  .btn-event {
    color: var(--amarillo); font-weight: 800; font-size: 0.85rem;
    text-decoration: none; background: none; border: none; cursor: pointer;
  }
  .btn-event:hover { text-decoration: underline; }

  /* ─── CULTURA ─── */
  #cultura { background: var(--gris-claro); }

  .cultura-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    grid-template-rows: auto auto;
    gap: 22px;
  }
  .cultura-featured {
    grid-row: 1 / 3;
    border-radius: 20px; overflow: hidden;
    background: #fff; border: 2.5px solid var(--oscuro);
    box-shadow: 6px 6px 0 var(--oscuro);
    transition: transform 0.25s;
  }
  .cultura-featured:hover { transform: translate(-4px,-4px); }
  .cultura-item {
    border-radius: 16px; overflow: hidden;
    background: #fff; border: 2px solid var(--oscuro);
    box-shadow: 4px 4px 0 var(--oscuro);
    transition: transform 0.25s;
  }
  .cultura-item:hover { transform: translate(-3px,-3px); }
  .ci-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--gris-claro); }
  .ci-body { padding: 16px; }
  .ci-tag {
    display: inline-block; padding: 3px 12px; border-radius: 50px;
    font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 8px;
    background: var(--azul); color: #fff;
  }
  .ci-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem; font-weight: 700; color: var(--oscuro);
    margin-bottom: 6px; line-height: 1.3;
  }
  .ci-sub { font-size: 0.84rem; color: var(--gris); line-height: 1.5; }
  .cf-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: var(--gris-claro); }
  .cf-body { padding: 24px; }
  .cf-tag {
    display: inline-block; padding: 4px 14px; border-radius: 50px;
    font-size: 0.78rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 12px;
    background: var(--rojo); color: #fff;
  }
  .cf-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem; font-weight: 900; color: var(--oscuro);
    margin-bottom: 10px; line-height: 1.25;
  }
  .cf-sub { font-size: 0.92rem; color: var(--gris); line-height: 1.65; margin-bottom: 16px; }
  .btn-leer {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--rojo); font-weight: 800; font-size: 0.9rem;
    text-decoration: none; background: none; border: none; cursor: pointer;
    padding: 0;
  }
  .btn-leer:hover { text-decoration: underline; }

  /* ─── IMPACTO ─── */
  #impacto {
    background: linear-gradient(135deg, var(--azul) 0%, #0d3278 100%);
    position: relative; overflow: hidden;
  }
  #impacto::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 50%, rgba(245,196,0,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(244,121,32,0.12) 0%, transparent 35%);
    pointer-events: none;
  }
  #impacto .section-tag { color: var(--amarillo); }
  #impacto .section-title { color: #fff; }
  #impacto .section-sub { color: rgba(255,255,255,0.70); }

  .impacto-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px; margin-top: 20px;
  }
  .impacto-card {
    background: rgba(255,255,255,0.09);
    border: 1.5px solid rgba(255,255,255,0.20);
    border-radius: 20px; padding: 32px 24px; text-align: center;
    transition: transform 0.25s, background 0.25s;
    position: relative;
  }
  .impacto-card:hover {
    transform: translateY(-6px);
    background: rgba(255,255,255,0.15);
  }
  .impacto-icon { font-size: 2.8rem; margin-bottom: 14px; display: block; }
  .impacto-num {
    font-family: 'Playfair Display', serif;
    font-size: 3rem; font-weight: 900;
    color: var(--amarillo); display: block; line-height: 1;
    margin-bottom: 6px;
  }
  .impacto-label { font-size: 0.88rem; font-weight: 700; color: rgba(255,255,255,0.80); text-transform: uppercase; letter-spacing: 0.05em; }

  /* ─── TESTIMONIOS ─── */
  #testimonios { background: var(--fondo); }

  .testimonios-wrap {
    overflow: hidden; position: relative;
  }
  .testimonios-track {
    display: flex; gap: 22px;
    transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .testimonio-card {
    min-width: 340px; flex-shrink: 0;
    background: #fff; border: 2px solid var(--oscuro);
    border-radius: 20px; padding: 28px;
    box-shadow: 5px 5px 0 var(--oscuro);
    position: relative;
  }
  .testimonio-card::before {
    content: '"';
    position: absolute; top: 16px; right: 20px;
    font-family: 'Playfair Display', serif;
    font-size: 5rem; color: var(--amarillo);
    line-height: 1; opacity: 0.7;
  }
  .t-text { font-size: 0.98rem; line-height: 1.7; color: var(--oscuro); margin-bottom: 20px; }
  .t-author { display: flex; align-items: center; gap: 12px; }
  .t-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    object-fit: cover; background: var(--gris-claro);
    border: 2px solid var(--oscuro);
    font-size: 1.4rem; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .t-info strong { display: block; font-size: 0.92rem; font-weight: 800; }
  .t-info span { font-size: 0.8rem; color: var(--gris); }
  .t-stars { color: var(--amarillo); font-size: 0.9rem; margin-top: 4px; }

  .carousel-controls { display: flex; gap: 12px; margin-top: 28px; }
  .car-btn {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2.5px solid var(--oscuro); background: transparent;
    cursor: pointer; font-size: 1.3rem;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s;
    font-weight: 700;
  }
  .car-btn:hover { background: var(--oscuro); color: #fff; }
  .car-btn.active { background: var(--oscuro); color: #fff; }

  /* ─── FOOTER ─── */
  footer {
    background: var(--oscuro); color: #fff;
    padding: 60px 5% 28px;
  }
  .footer-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1.4fr;
    gap: 40px; margin-bottom: 48px;
  }
  .footer-brand .logo-mark { margin-bottom: 14px; }
  .footer-brand p { font-size: 0.9rem; color: rgba(255,255,255,0.60); line-height: 1.65; max-width: 300px; }
  .footer-social { display: flex; gap: 10px; margin-top: 20px; }
  .social-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; font-size: 1.1rem; color: #fff;
    transition: background 0.2s;
  }
  .social-btn:hover { background: var(--rojo); }

  footer h4 {
    font-size: 0.85rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--amarillo);
    margin-bottom: 18px;
  }
  footer ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  footer ul li a {
    color: rgba(255,255,255,0.60); text-decoration: none;
    font-size: 0.9rem; font-weight: 600;
    transition: color 0.2s;
  }
  footer ul li a:hover { color: #fff; }

  .footer-contact p {
    font-size: 0.88rem; color: rgba(255,255,255,0.60);
    line-height: 1.7; margin-bottom: 6px;
  }
  .footer-contact p strong { color: #fff; }

  .footer-bottom {
    bo
